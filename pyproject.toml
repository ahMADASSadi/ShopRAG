[project]
name = "shoprag"
version = "0.1.0"
description = "A RAG-powered shop price comparison and dynamic price update system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.9",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "qdrant-client==1.9.1",
    "sentence-transformers==2.7.0",
    "transformers==4.57.6",
    "torch==2.11.0",
    "duckduckgo-search==6.1.7",
    "loguru==0.7.2",
    "sqladmin==0.18.0",
    "httpx==0.27.0",
    "python-multipart==0.0.22",
    "python-dotenv==1.0.1",
]

[dependency-groups]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "ruff>=0.11.10",
    "pyrefly>=0.15.0",
    "pre-commit>=4.2.0",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

# ---------------------------------------------------------------------------
# ruff – linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line-too-long – handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# alembic
# ---------------------------------------------------------------------------
[tool.alembic]
script_location = "alembic"
prepend_sys_path = "."
version_path_separator = "os"
# Overridden at runtime by DATABASE_URL env var (see alembic/env.py)
sqlalchemy.url = "postgresql://shoprag:shoprag@db:5432/shoprag"
