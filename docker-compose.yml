version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://shoprag:shoprag@db:5432/shoprag
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - shoprag-network

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: shoprag
      POSTGRES_PASSWORD: shoprag
      POSTGRES_DB: shoprag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoprag -d shoprag"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shoprag-network

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - shoprag-network

volumes:
  postgres_data:
  qdrant_data:

networks:
  shoprag-network:
    driver: bridge
